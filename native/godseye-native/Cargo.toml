[package]
name = "godseye-native"
version = "0.1.0"
edition = "2021"
description = "Native Rust God's Eye global intelligence command center"

[dependencies]
macroquad = "0.4.13"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
image = { version = "0.24.9", default-features = false, features = ["jpeg"] }
h3o = "0.11.1"
geojson = "1.0.0"
chrono = { version = "0.4.43", default-features = false, features = ["std"] }
sgp4 = "2.4.0"
ureq = "3.2.0"
unicode-normalization = "0.1.26"

